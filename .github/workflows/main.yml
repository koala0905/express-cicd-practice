name: Docker CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 準備 Node.js 環境（因為 ESLint 需要 Node 執行）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./package-lock.json"

      # 2. 安裝套件（包含 eslint）
      - name: Install dependencies
        run: |
          npm install

      # 3. 執行語法檢查（如果失敗，Workflow 會在這裡停住）
      - name: Run Linting
        run: |
          npm run lint

      # 4. 執行單元測試（如果失敗，Workflow 會在這裡停住）
      - name: Run Unit Tests
        run: npm test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
